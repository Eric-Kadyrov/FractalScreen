<style>

.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;background:#FFC27A;color:#101233;font-weight:600;font-size:18px;text-decoration:none}
.btn:hover{color:#101233;filter:brightness(1.06)}
.btn.ghost{background:transparent;color:#F1EEFF;box-shadow:inset 0 0 0 1.5px rgba(241,238,255,.45)}
.btn.ghost:hover{color:#FFC27A}
ol{list-style:none;padding:0;margin:64px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:36px}
.num{font-family:"Syne","Instrument Sans",sans-serif;font-weight:800;font-size:40px;line-height:1;color:#FFC27A}

.key{margin:40px 0 0;padding:22px 24px;border-radius:16px;background:#181B45;display:flex;flex-direction:column;gap:12px}
.key[hidden]{display:none}
.key .label{font-size:14px;font-weight:600;color:#B5B3D6}
.key .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.key code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:18px;padding:10px 14px;border-radius:10px;background:#101233;color:#FFC27A;word-break:break-all}
.key p{margin:0;color:#CFCDEA;font-size:15px}
.copy{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#F1EEFF;color:#101233;cursor:pointer}
:focus-visible{outline:3px solid #FFC27A;outline-offset:3px}

<div class="wrap">
<a class="brand" href="index.html"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none" style="flex: none; display: block"><defs><linearGradient id="fsLogoGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC27A"></stop><stop offset="0.55" stop-color="#FF8FB1"></stop><stop offset="1" stop-color="#8C7CFF"></stop></linearGradient></defs><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10" fill="#1C1F55" stroke="rgba(241,238,255,0.22)" stroke-width="1.5"></rect><g stroke="url(#fsLogoGrad)" stroke-width="1.4" stroke-linejoin="round"><polygon points="32.74,32.74 7.26,32.74 7.26,7.26 32.74,7.26" stroke-opacity="1.00"></polygon><polygon points="28.26,32.25 7.75,28.26 11.74,7.75 32.25,11.74" stroke-opacity="0.94"></polygon><polygon points="24.73,31.15 8.85,24.73 15.27,8.85 31.15,15.27" stroke-opacity="0.88"></polygon><polygon points="22.07,29.72 10.28,22.07 17.93,10.28 29.72,17.93" stroke-opacity="0.82"></polygon><polygon points="20.14,28.14 11.86,20.14 19.86,11.86 28.14,19.86" stroke-opacity="0.76"></polygon><polygon points="18.84,26.58 13.42,18.84 21.16,13.42 26.58,21.16" stroke-opacity="0.70"></polygon><polygon points="18.04,25.11 14.89,18.04 21.96,14.89 25.11,21.96" stroke-opacity="0.64"></polygon><polygon points="17.62,23.81 16.19,17.62 22.38,16.19 23.81,22.38" stroke-opacity="0.58"></polygon><polygon points="17.49,22.69 17.31,17.49 22.51,17.31 22.69,22.51" stroke-opacity="0.52"></polygon></g><circle cx="20" cy="20" r="1.6" fill="#FFC27A"></circle></svg><span>FRACTALSCREEN</span></a>
<main id="main">
<h1 id="title">Your download is starting</h1>
<p class="lead" id="lead">If nothing happens in a few seconds, use the button below.</p>
<div class="btns" id="btns"></div>
<section class="key" id="keyBox" hidden aria-live="polite">
<span class="label">Your license key</span>
<div class="row"><code id="keyText">Getting your key…</code><button class="copy" id="copyBtn" type="button">Copy</button></div>
<p id="keyNote">Keep it safe. The Windows installer asks for it, and we copy it for you when you click Download.</p>
</section>
<ol id="steps"></ol>
<p class="note" id="note"></p>
</main>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var plan = (params.get("plan") || "free").toLowerCase();
  if (plan !== "premium" && plan !== "business") plan = "free";
  var paid = plan !== "free", sessionId = params.get("session_id") || "";
  var file = paid ? "downloads/FractalScreen-Premium-Setup.exe" : "downloads/FractalScreen-Free-Setup.exe";
  var web = paid ? "app-premium.html" : "app.html";
  var name = paid ? "FractalScreen-Premium-Setup.exe" : "FractalScreen-Free-Setup.exe";
  var isWindows = /Windows NT/i.test(navigator.userAgent), isMac = /Macintosh|Mac OS X/i.test(navigator.userAgent) && !/iPhone|iPad/i.test(navigator.userAgent);
  var $ = function (id) { return document.getElementById(id); };
  var icon = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"></path></svg>';
  var licenseKey = "";
  try { licenseKey = (JSON.parse(localStorage.getItem("fractalscreen-license") || "{}").key) || ""; } catch (e) {}

  function copyKey() {
    if (!licenseKey || !navigator.clipboard) return Promise.resolve(false);
    return navigator.clipboard.writeText(licenseKey).then(function () { return true; }, function () { return false; });
  }

  if (isWindows) {
    $("title").textContent = paid ? "Thank you! Your download is ready" : "Your download is starting";
    if (paid) $("lead").textContent = "Click Download. Your license key is copied at the same time, so the installer can fill it in.";
    $("btns").innerHTML = '<a class="btn" id="dlBtn" href="' + file + '" download>' + icon + 'Download for Windows</a>' +
      '<a class="btn ghost" href="' + web + '">Open the Web Player</a>';
    $("steps").innerHTML =
      '<li><span class="num">1</span><h2>Open the file</h2><p>Click <strong>' + name + '</strong> in your browser’s downloads.</p></li>' +
      '<li><span class="num">2</span><h2>' + (paid ? 'Confirm your key' : 'Allow it, if asked') + '</h2><p>' +
        (paid ? 'Your key is already filled in. If Windows says it protected your PC, click <strong>More info</strong>, then <strong>Run anyway</strong>.'
              : 'If Windows says it protected your PC, click <strong>More info</strong>, then <strong>Run anyway</strong>.') + '</p></li>' +
      '<li><span class="num">3</span><h2>Done</h2><p>' + (paid ? 'FRACTALSCREEN runs for as long as your subscription is active.'
              : 'Your 2-week free trial starts now. The time left is shown in FRACTALSCREEN settings.') + '</p></li>';
    $("dlBtn").addEventListener("click", function () { copyKey(); });
    if (!paid) setTimeout(function () { location.href = file; }, 900);   // free: one click on the site is enough
  } else {
    $("title").textContent = paid ? "Thank you! FRACTALSCREEN is ready" : "FRACTALSCREEN is ready";
    $("lead").textContent = (isMac ? "The Mac app is coming soon. Until then, " : "On this device, ") +
      "play FRACTALSCREEN with the Web Player. Leave it open on screen and it starts after a few minutes without activity.";
    $("btns").innerHTML = '<a class="btn" href="' + web + '">Open the Web Player</a>' +
      '<a class="btn ghost" id="dlBtn" href="' + file + '" download>' + icon + 'Windows installer</a>';
    $("steps").innerHTML =
      '<li><span class="num">1</span><h2>Open it</h2><p>Open the Web Player. In Chrome or Edge you can install it as an app; on a phone or tablet, add it to your home screen.</p></li>' +
      '<li><span class="num">2</span><h2>Pick a look</h2><p>Choose a fractal, colors and how many minutes to wait before it starts.</p></li>' +
      '<li><span class="num">3</span><h2>Step away</h2><p>' + (paid ? 'It runs for as long as your subscription is active.' : 'The Web Player is free forever with 3 fractals.') + '</p></li>';
    $("dlBtn").addEventListener("click", function () { copyKey(); });
  }

  function showKey(k) {
    licenseKey = k; $("keyText").textContent = k; $("keyBox").hidden = false;
    try { localStorage.setItem("fractalscreen-license", JSON.stringify({ key: k })); } catch (e) {}
  }
  if (paid) {
    $("keyBox").hidden = false;
    $("copyBtn").addEventListener("click", function () {
      copyKey().then(function (ok) { $("copyBtn").textContent = ok ? "Copied" : "Select and copy"; });
    });
    if (/^cs_(test|live)_/.test(sessionId)) {
      var tries = 0;
      (function poll() {
        fetch("/api/license.php?session_id=" + encodeURIComponent(sessionId), { cache: "no-store" })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
          .then(function (res) {
            if (res.j && res.j.key) { showKey(res.j.key); return; }
            if (res.status === 202 && ++tries < 15) { setTimeout(poll, 2000); return; }
            throw new Error("no key");
          })
          .catch(function () {
            $("keyText").textContent = licenseKey || "Not available yet";
            $("keyNote").innerHTML = "We couldn’t load your key just now. Refresh this page in a minute, or <a href=\"mailto:contact@fractalscreen.com\" data-contact=\"License key\">email us</a> with your receipt.";
          });
      })();
    } else if (licenseKey) {
      showKey(licenseKey);
    } else {
      $("keyText").textContent = "Shown after checkout";
      $("keyNote").innerHTML = "Lost your key? <a href=\"mailto:contact@fractalscreen.com\" data-contact=\"\">Email us</a> with the email address you paid with, and we’ll send it again.";
    }
  }

  $("note").innerHTML = "Mac, Android and iPhone apps are coming soon" + (paid ? ", and they’ll be included in your plan." : ".") +
    " Questions? <a href=\"mailto:contact@fractalscreen.com\" data-contact=\"\">Email us</a>.";
})();
</script>
